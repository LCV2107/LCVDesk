# Publica una versión de LCVDesk al hacer push de una etiqueta vX.Y.Z (estable) o vX.Y.Z-beta.N (beta).
# Compila el MSI, calcula su SHA-256 y crea la Release de GitHub con ambos archivos.
# Las etiquetas con sufijo (-beta/-rc) se publican como prerelease (canal Beta de la app).
# El updater lee estas Releases para ofrecer la actualización.
#
# La BASE de la etiqueta debe coincidir con Cargo.toml (v0.2.0-beta.1 ⇒ Cargo.toml 0.2.0).
# La versión completa (con sufijo) se incrusta en el binario vía LCVDESK_VERSION; así el mismo
# commit probado en beta puede re-etiquetarse como estable sin tocar Cargo.toml.
name: Publicar versión

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publicar:
    runs-on: windows-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v5

      - name: Preparar Rust (MSVC)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cachear dependencias de cargo
        uses: Swatinem/rust-cache@v2

      - name: Instalar WiX 5
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add -g WixToolset.Firewall.wixext/5.0.2

      - name: Comprobar que la base de la etiqueta coincide con Cargo.toml
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          $base = ($version -split '-')[0]
          $cargo = (cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages |
            Where-Object name -eq 'lcvdesk' | Select-Object -ExpandProperty version
          if ($base -ne $cargo) { throw "La base de la etiqueta ($base) no coincide con Cargo.toml ($cargo)." }

      - name: Compilar el MSI
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          .\tools\build-msi.ps1 -Version $version

      - name: Crear la Release con el MSI y su SHA-256
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          $msi = "dist\LCVDesk-$version-x64.msi"
          $notes = "notas.md"
          if (-not (Test-Path $notes)) { "LCVDesk $version" | Set-Content $notes -Encoding utf8 }
          $args = @("${{ github.ref_name }}", $msi, "$msi.sha256", '--title', "LCVDesk $version", '--notes-file', $notes)
          if ($version -match '-') { $args += '--prerelease' }   # beta/rc ⇒ prerelease
          gh release create @args
