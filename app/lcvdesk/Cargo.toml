[package]
name = "lcvdesk"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.104"
eframe = "0.37.0"
hostname = "0.4.2"
lcv-audio = { path = "../../crates/lcv-audio" }
lcv-capture = { path = "../../crates/lcv-capture" }
lcv-codec = { path = "../../crates/lcv-codec" }
lcv-input = { path = "../../crates/lcv-input" }
lcv-proto = { path = "../../crates/lcv-proto" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
socket2 = "0.5.10"
sha2 = "0.11.1"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
ureq = "2"
windows = { version = "0.62.2", features = ["Win32_UI_HiDpi", "Win32_UI_WindowsAndMessaging", "Win32_Foundation", "Win32_System_Registry", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_Security_Cryptography", "Win32_System_Threading", "Win32_System_LibraryLoader", "Win32_UI_Input", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Pipes", "Win32_System_RemoteDesktop"] }

[build-dependencies]
winresource = "0.1.20"
